<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website ARCA</title>
  <body>

  <div class="card">
    <h1>Selamat Datang di Website ARCA</h1> 
    <img src="Arca.jpeg" alt="Logo Kelompok ARCA" class="logo">
    <p>Satu Sistem, Banyak Peran, Satu Tujuan.</p>
    <a href="https://arca2026.wordpress.com/" class="btn">Masuk Ke Website</a>
  </div>

</body>
<style>
* 
{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f8f9fa;
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    text-align: center;
}
.card {
    background: #ffffff;
    padding: 40px 30px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    max-width: 450px;
    width: 90%;
}
.logo {
    width: 180px;
    height: auto;
    margin: 20px 0;
}
h1 {
    font-size: 1.5rem;
    color: #0d233a;
    margin-bottom: 8px;
}
p {
    color: #666;
    font-size: 0.95rem;
    margin-bottom: 24px;
}
.btn {
    display: inline-block;
    background-color: #0d233a;
    color: #ffffff;
    padding: 12px 28px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    transition: background-color 0.2s ease;
}
.btn:hover {
    background-color: #1a3c5e;
}
</style>
</head>
</html>
